<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Aniket Jumde — social card. Dark editorial + electric lime. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12120E"/>
      <stop offset="55%" stop-color="#0B0B0A"/>
      <stop offset="100%" stop-color="#14180B"/>
    </linearGradient>
    <radialGradient id="bloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4FF38" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#D4FF38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#field)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="1055" cy="110" r="330" fill="url(#bloomA)"/>
    <circle cx="905" cy="250" r="380" fill="url(#bloomB)"/>

    <!-- top meta rule -->
    <line x1="64" y1="92" x2="1136" y2="92" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <g font-family="JetBrains Mono" font-size="14" fill="#9C9C8C" letter-spacing="3.1">
      <text x="64" y="74">PORTFOLIO — VOL. 03</text>
      <text x="1136" y="74" text-anchor="end">JAVA DEVELOPER / PROBLEM SOLVER</text>
    </g>

    <!-- availability pill -->
    <g transform="translate(64 118)">
      <circle cx="4" cy="0" r="4" fill="#D4FF38"/>
      <text x="18" y="5" font-family="JetBrains Mono" font-size="12.5" fill="#D4FF38" letter-spacing="2.4">OPEN TO INTERNSHIPS &amp; FULL-TIME ROLES</text>
    </g>

    <!-- poster name, stacked -->
    <g font-family="Anton" fill="#F2F2E9" letter-spacing="1">
      <text x="58" y="332" font-size="178">ANIKET</text>
      <text x="58" y="490" font-size="178">JUMDE<tspan fill="#D4FF38">.</tspan></text>
    </g>

    <!-- descriptor -->
    <text x="64" y="548" font-family="Inter Tight" font-size="25" fill="#B4B4A4">Multi-role web applications with relational backends —</text>
    <text x="64" y="584" font-family="Inter Tight" font-size="25" fill="#B4B4A4">schema, servlets, and interface built to agree.</text>

    <!-- metrics rail, right -->
    <g transform="translate(892 176)">
      <line x1="0" y1="0" x2="244" y2="0" stroke="#D4FF38" stroke-width="2"/>
      <g font-family="Anton" fill="#F2F2E9">
        <text x="0" y="52" font-size="42">1+</text>
        <text x="0" y="118" font-size="42">150+</text>
        <text x="0" y="184" font-size="42">5★</text>
        <text x="0" y="250" font-size="42">8.22</text>
      </g>
      <g font-family="JetBrains Mono" font-size="10.5" fill="#8A8A7A" letter-spacing="1.7">
        <text x="132" y="50">YEARS JAVA</text>
        <text x="132" y="116">LEETCODE</text>
        <text x="132" y="182">HACKERRANK</text>
        <text x="132" y="248">CGPA B.TECH</text>
      </g>
      <line x1="0" y1="292" x2="244" y2="292" stroke="#FFFFFF" stroke-opacity="0.12"/>
    </g>

    <!-- footer -->
    <line x1="64" y1="612" x2="1136" y2="612" stroke="#D4FF38" stroke-opacity="0.35"/>
    <text x="1136" y="600" text-anchor="end" font-family="JetBrains Mono" font-size="13" fill="#8A8A7A" letter-spacing="1.4">aniketjumdeportfolio.vercel.app</text>
  </g>
</svg>
