<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#241E16" opacity="0.06"/>
    </pattern>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F0E7"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- top rule / metadata -->
  <line x1="64" y1="86" x2="1136" y2="86" stroke="#241E16" stroke-opacity="0.18"/>
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#6B6152" letter-spacing="2.5">
    <text x="64" y="70">PORTFOLIO — VOL. 01</text>
    <text x="1136" y="70" text-anchor="end">JAVA DEVELOPER</text>
  </g>

  <!-- giant name -->
  <text x="60" y="300" font-family="Fraunces, Georgia, serif" font-size="148" font-weight="600" fill="#241E16" letter-spacing="-6">Aniket</text>
  <text x="60" y="432" font-family="Fraunces, Georgia, serif" font-size="148" font-weight="600" fill="#241E16" letter-spacing="-6">Jumde<tspan fill="#C2462B">.</tspan></text>

  <!-- oxide rule + subtitle -->
  <line x1="64" y1="480" x2="188" y2="480" stroke="#C2462B" stroke-width="3"/>
  <text x="64" y="530" font-family="Inter Tight, Inter, sans-serif" font-size="26" fill="#4A4238">Aspiring problem solver — strong foundation in mathematics, logic,</text>
  <text x="64" y="566" font-family="Inter Tight, Inter, sans-serif" font-size="26" fill="#4A4238">and over a year of hands-on Java.</text>

  <!-- right metrics block -->
  <g transform="translate(846 150)">
    <rect x="0" y="0" width="290" height="330" fill="none" stroke="#241E16" stroke-opacity="0.2"/>
    <g font-family="Fraunces, Georgia, serif" fill="#241E16">
      <text x="24" y="66" font-size="40" font-weight="600">1+</text>
      <text x="24" y="146" font-size="40" font-weight="600">150+</text>
      <text x="24" y="226" font-size="40" font-weight="600">5★</text>
      <text x="24" y="306" font-size="40" font-weight="600">8.22</text>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#6B6152" letter-spacing="1.6">
      <text x="150" y="66">YEARS JAVA</text>
      <text x="150" y="146">LEETCODE</text>
      <text x="150" y="226">HACKERRANK</text>
      <text x="150" y="306">CGPA</text>
