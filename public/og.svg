    <line x1="24" y1="90" x2="266" y2="90" stroke="#241E16" stroke-opacity="0.12"/>
    <line x1="24" y1="170" x2="266" y2="170" stroke="#241E16" stroke-opacity="0.12"/>
    <line x1="24" y1="250" x2="266" y2="250" stroke="#241E16" stroke-opacity="0.12"/>
  </g>

  <text x="1136" y="590" font-family="JetBrains Mono, monospace" font-size="14" fill="#C2462B" letter-spacing="2" text-anchor="end">aniketjumdeportfolio.vercel.app</text>
